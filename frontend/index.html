<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LinkGuard</title>
<style>
  :root { --bg:#f4f5f7; --card:#fff; --ink:#1d2330; --muted:#6b7280; --accent:#2457d6;
          --ok:#1f8a4c; --bad:#c0392b; --wait:#b7791f; --line:#e3e6eb; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 system-ui, "Segoe UI", sans-serif; }
  main { max-width: 980px; margin: 0 auto; padding: 32px 16px; }
  h1 { margin:0; font-size: 28px; }
  .sub { color: var(--muted); margin: 4px 0 24px; }
  .card { background: var(--card); border:1px solid var(--line); border-radius: 10px; padding: 20px; margin-bottom: 20px; }
  form { display:flex; gap: 10px; flex-wrap: wrap; }
  input[type=url] { flex: 1 1 360px; padding: 10px 12px; border:1px solid var(--line); border-radius: 8px; font: inherit; }
  button { padding: 10px 16px; border:0; border-radius: 8px; background: var(--accent); color:#fff; font: inherit; cursor: pointer; }
  button.ghost { background: transparent; color: var(--accent); border:1px solid var(--line); padding: 4px 10px; }
  button.danger { background: transparent; color: var(--bad); border:1px solid var(--line); padding: 4px 10px; }
  #msg { margin-top: 10px; min-height: 1.5em; color: var(--muted); }
  .table-wrap { overflow-x: auto; }
  table { width:100%; border-collapse: collapse; }
  th, td { text-align:left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 500; font-size: 13px; }
  td.url { max-width: 320px; word-break: break-all; }
  .badge { display:inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; color:#fff; }
  .clean { background: var(--ok); } .malicious { background: var(--bad); } .pending { background: var(--wait); }
  .verdict { color: var(--muted); font-size: 12px; }
  .row { display:flex; gap: 16px; flex-wrap: wrap; }
  .stat { flex: 1 1 140px; }
  .stat b { display:block; font-size: 22px; }
  .stat span { color: var(--muted); font-size: 13px; }
  code { font-size: 13px; }
</style>
</head>
<body>
<main>
  <h1>LinkGuard</h1>
  <p class="sub">Сокращатель ссылок с антифишинговой проверкой. <span id="hello"></span></p>

  <section class="card">
    <form id="form">
      <input id="url" type="url" required placeholder="https://example.com/very/long/link">
      <button type="submit">Сократить</button>
    </form>
    <div id="msg"></div>
  </section>

  <section class="card">
    <div class="row" id="stats"></div>
  </section>

  <section class="card">
    <div class="table-wrap">
      <table>
        <thead><tr><th>Код</th><th>Адрес</th><th>Статус</th><th>Переходы</th><th></th></tr></thead>
        <tbody id="links"></tbody>
      </table>
    </div>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
